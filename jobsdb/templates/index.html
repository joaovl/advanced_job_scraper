<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Library</title>
<style> :root{
 --bg:#0e1219; --panel:#161c26; --ink:#e8ecf3; --soft:#9aa5b6;
 --line:#26303e; --accent:#e6953f; --teal:#4fb3bf; --new:#3ecf8e; --warn:#e6953f;
 --chipbg:#1d2530;
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);
 font:14.5px/1.55 "Segoe UI",system-ui,sans-serif;}
 header{padding:14px 22px;border-bottom:1px solid var(--line);border-top:3px solid var(--accent);
 display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);}
 header h1{font-size:18px;margin:0;letter-spacing:.02em}
 header h1 .sub{color:var(--soft);font-weight:400;font-size:13px;margin-left:8px}
 .stats{display:flex;gap:16px;margin-left:auto;font-size:12.5px;color:var(--soft)}
 .stats b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
 .stat.new b{color:var(--new)} .stat.comp b{color:var(--warn)}
 .layout{display:grid;grid-template-columns:230px 1fr;gap:0;height:calc(100vh - 62px)}
 aside{border-right:1px solid var(--line);overflow-y:auto;padding:12px;background:var(--panel)}
 aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:6px 4px}
 .co{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
 .co:hover{background:var(--chipbg)} .co.active{background:var(--chipbg);outline:1px solid var(--teal)}
 .co .n{color:var(--soft);font-variant-numeric:tabular-nums}
 .co.comp .name::before{content:"RIVAL ";}
 main{overflow-y:auto;padding:16px 22px}
 .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
 input[type=search]{flex:1;min-width:220px;background:var(--chipbg);border:1px solid var(--line);
 color:var(--ink);padding:9px 12px;border-radius:8px;font-size:14px}
 .chip{border:1px solid var(--line);background:var(--chipbg);color:var(--soft);
 padding:7px 12px;border-radius:20px;cursor:pointer;font-size:12.5px;user-select:none}
 .chip.on{background:var(--teal);color:#04202a;border-color:var(--teal);font-weight:600}
 .chip.new.on{background:var(--new);color:#052a17}
 .chip.comp.on{background:var(--warn);color:#2a1705}
 button.exp{border:1px solid var(--line);background:var(--chipbg);color:var(--ink);
 padding:7px 14px;border-radius:8px;cursor:pointer}
 button.exp:hover{border-color:var(--teal)}
 .count{color:var(--soft);font-size:13px;margin:2px 0 12px}
 .job{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;overflow:hidden}
 .job .row{display:flex;gap:12px;align-items:baseline;padding:12px 14px;cursor:pointer}
 .job .row:hover{background:var(--chipbg)}
 .job .t{font-weight:600;font-size:15px}
 .job .meta{color:var(--soft);font-size:12.5px;margin-left:auto;white-space:nowrap}
 .badge{font-size:10.5px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
 .badge.new{background:var(--new);color:#052a17}
 .badge.comp{background:var(--warn);color:#2a1705}
 .badge.src{background:var(--chipbg);color:var(--soft);border:1px solid var(--line);font-weight:500;text-transform:none}
 .co-name{color:var(--teal);font-size:12.5px}
 .badge.score{background:#2a3550;color:#cfe0ff}
 .badge.pay{background:#20372a;color:#8fe0b0;text-transform:none;font-weight:600}
 .badge.score.hi{background:var(--new);color:#052a17}
 .badge.score.mid{background:var(--warn);color:#2a1705}
 .badge.score.lo{background:#4a2530;color:#ffbcbc}
 .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 22px;
 border-bottom:1px solid var(--line);background:var(--panel)}
 .actions .btn{border:1px solid var(--line);background:var(--chipbg);color:var(--ink);
 padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
 .actions .btn:hover{border-color:var(--teal)}
 .actions .btn:disabled{opacity:.5;cursor:default}
 .actions select{background:var(--chipbg);border:1px solid var(--line);color:var(--ink);
 padding:7px 9px;border-radius:8px}
 .actions .prog{flex:1;min-width:180px;height:10px;background:var(--chipbg);border-radius:6px;
 overflow:hidden;display:none}
 .actions .prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
 .actions .pmsg{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:42%}
 .desc{padding:0 16px 16px;border-top:1px solid var(--line);display:none;white-space:pre-wrap;
 color:#cdd5e2;font-size:13.5px}
 .desc.open{display:block}
 .desc a{color:var(--teal)}
 .loading{color:var(--soft);padding:30px;text-align:center}
 .err{color:#ff8f8f;padding:20px}
</style>
</head>
<body>
<header> <h1> Job Library <span class="sub">aviation · aerospace · competitor watch</span></h1> <nav style="display:flex;gap:6px;margin-left:6px"> <a href="/" style="color:var(--soft);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px">Home</a> <a href="/library" style="color:var(--teal);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px;background:#1b2330">Library</a> <a href="/run" style="color:var(--soft);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px">Run Center</a> <a href="/salaries" style="color:var(--soft);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px">Salaries</a> <a href="/dashboard?file=/api/analysis.json" style="color:var(--soft);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px">Dashboard</a> <a href="/builder" style="color:var(--soft);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px">Builder</a> </nav> <div class="stats" id="stats"></div>
</header>
<div class="actions"> <button class="btn" id="btn-refresh">Refresh jobs</button> <button class="btn" id="btn-ai">AI score</button> <select id="ai-backend" title="AI backend"> <option value="claude">Claude (haiku)</option> <option value="ollama">Ollama (local)</option> </select> <label style="font-size:12px;color:var(--soft)"><input type="checkbox" id="ai-comp"> competitors only</label> <div class="prog" id="prog"><i id="progbar"></i></div> <span class="pmsg" id="pmsg"></span>
</div>
<div class="layout"> <aside> <h3>Companies</h3> <div id="companies"></div> </aside> <main> <div class="controls"> <input id="q" type="search" placeholder="Search title, company, description…"> <span class="chip comp" data-f="competitor">Competitors</span> <span class="chip new" data-f="new">New</span> <span class="chip" data-f="scored">Scored</span> <select id="country" title="Country"><option value="">All countries</option></select> <select id="minscore" title="Minimum AI score"> <option value="">Any score</option> <option value="9">≥ 9</option><option value="8">≥ 8</option> <option value="7">≥ 7</option><option value="6">≥ 6</option> </select> <span class="chip" id="sortscore">Sort by score</span> <span class="chip" id="sortpay">Sort by pay</span> <label class="chip" style="cursor:default"><input type="checkbox" id="haspay" style="margin-right:5px">Has pay</label> <button class="exp" id="export">Export CSV</button> </div> <div class="count" id="count"></div> <div id="results"><div class="loading">Loading…</div></div> </main>
</div>
<script>
const state = {q:"", company:"", country:"", competitor:false, new:false, scored:false,
 has_pay:false, min_score:"", sort:"", status:"open"};
const $ = s => document.querySelector(s);

function qs(){
 const p = new URLSearchParams();
 if(state.q) p.set("q", state.q);
 if(state.company) p.set("company", state.company);
 if(state.country) p.set("country", state.country);
 if(state.competitor) p.set("competitor","1");
 if(state.new) p.set("new","1");
 if(state.scored) p.set("scored","1");
 if(state.has_pay) p.set("has_salary","1");
 if(state.min_score) p.set("min_score", state.min_score);
 if(state.sort) p.set("sort", state.sort);
 p.set("status", state.status);
 return p.toString();
}

async function loadStats(){
 const d = await (await fetch("/api/stats")).json();
 const s = d.summary;
 $("#stats").innerHTML =
 `<div class="stat"><b>${s.open}</b> open</div>`+
 `<div class="stat new"><b>${s.new}</b> new</div>`+
 `<div class="stat comp"><b>${s.competitor}</b> competitor</div>`+
 `<div class="stat"><b>${s.scored||0}</b> scored</div>`+
 `<div class="stat new"><b>${s.matched||0}</b> matched</div>`+
 `<div class="stat"><b>${s.companies}</b> companies</div>`;
 $("#companies").innerHTML = d.companies.map(c=> `<div class="co ${c.comp?'comp':''}" data-co="${encodeURIComponent(c.company)}"> <span class="name">${c.company}</span><span class="n">${c.n}</span></div>`).join("");
 const csel=$("#country"); if(csel && csel.options.length<=1){ (d.countries||[]).forEach(c=>{ const o=document.createElement("option"); o.value=c.country; o.textContent=`${c.country} (${c.n})`; csel.appendChild(o); }); }
 document.querySelectorAll(".co").forEach(el=>el.onclick=()=>{
 const co = decodeURIComponent(el.dataset.co);
 state.company = state.company===co ? "" : co;
 document.querySelectorAll(".co").forEach(x=>x.classList.remove("active"));
 if(state.company) el.classList.add("active");
 load();
 });
}

async function load(){
 $("#results").innerHTML = '<div class="loading">Loading…</div>';
 const d = await (await fetch("/api/jobs?"+qs()+"&limit=300")).json();
 $("#count").textContent = `${d.total} role${d.total===1?'':'s'}`+
 (state.company?` · ${state.company}`:"");
 if(!d.rows.length){ $("#results").innerHTML='<div class="loading">No matches.</div>'; return; }
 $("#results").innerHTML = d.rows.map(r=>`
 <div class="job" data-id="${r.id}"> <div class="row"> ${scoreBadge(r.ai_score, r.ai_match)}
 ${r.is_new?'<span class="badge new">new</span>':''}
 ${r.is_competitor?'<span class="badge comp">RIVAL</span>':''}
 <span class="badge src">${r.source}</span> ${payBadge(r)} <div> <div class="t">${esc(r.title)}</div> <div class="co-name">${esc(r.company)}${r.competitor?' — '+esc(r.competitor):''}</div> </div> <span class="meta">${esc(r.location)} · ${r.desc_len} chars</span> </div> <div class="desc" id="d${r.id}"></div> </div>`).join("");
 document.querySelectorAll(".job .row").forEach(row=>row.onclick=()=>toggle(row.parentElement));
}

async function toggle(job){
 const id = job.dataset.id, box = $("#d"+id);
 if(box.classList.contains("open")){ box.classList.remove("open"); return; }
 if(!box.dataset.loaded){
 const j = await (await fetch("/api/job/"+id)).json();
 const link = j.url?`\n\n ${j.url}`:"";
 box.textContent = (j.description||"(no description stored)")+link;
 box.dataset.loaded = "1";
 }
 box.classList.add("open");
}

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scoreBadge(sc, match){
 if(sc===null||sc===undefined) return '';
 const cls = sc>=8?'hi':sc>=6?'mid':'lo';
 return `<span class="badge score ${cls}" title="AI match score">${match?'':''}${sc}/10</span>`;
}
const SYM={GBP:"£",USD:"$",EUR:"€"};
function money(cur,n){ const s=SYM[cur]||''; return n>=1000?s+Math.round(n/1000)+'k':s+n; }
function payBadge(r){
 if(r.salary_max==null && r.salary_min==null) return '';
 const cur=r.salary_currency||'', per=r.salary_period==='hour'?'/hr':'';
 let txt = (r.salary_min && r.salary_max && r.salary_min!==r.salary_max)
   ? money(cur,r.salary_min)+'–'+money(cur,r.salary_max)
   : money(cur, r.salary_max||r.salary_min);
 return `<span class="badge pay" title="Published salary">${txt}${per}</span>`;
}

// --- Task runner (Refresh / AI score) with progress polling ---
let polling=null;
function setBusy(b){ $("#btn-refresh").disabled=b; $("#btn-ai").disabled=b;
 $("#prog").style.display=b?'block':'none'; if(!b){$("#pmsg").textContent='';} }
async function runTask(kind, opts){
 setBusy(true); $("#pmsg").textContent='starting…';
 const res = await fetch("/api/run/"+kind, {method:"POST",
 headers:{"Content-Type":"application/json"}, body:JSON.stringify(opts||{})});
 if(res.status===409){ $("#pmsg").textContent='already running'; setBusy(false); return; }
 const t = await res.json();
 clearInterval(polling);
 polling = setInterval(async ()=>{
 const s = await (await fetch("/api/task/"+t.id)).json();
 const pct = s.total? Math.round(s.progress) : s.progress;
 $("#progbar").style.width = (pct||0)+"%";
 $("#pmsg").textContent = s.message||'';
 if(s.status!=="running"){ clearInterval(polling); setBusy(false);
 loadStats(); load(); }
 }, 1200);
}
$("#btn-refresh").onclick = ()=> runTask("refresh", {});
$("#btn-ai").onclick = ()=> runTask("ai", {
 limit:60, backend:$("#ai-backend").value,
 model:$("#ai-backend").value==="claude"?"haiku":null,
 competitor_only:$("#ai-comp").checked, only_unscored:true });

let timer;
$("#q").oninput = e=>{ clearTimeout(timer); state.q=e.target.value;
 timer=setTimeout(load,250); };
document.querySelectorAll(".chip[data-f]").forEach(ch=>ch.onclick=()=>{
 const f = ch.dataset.f;
 if(f==="status"){ state.status = state.status==="open"?"closed":"open";
 ch.classList.toggle("on", state.status==="closed"); }
 else { state[f] = !state[f]; ch.classList.toggle("on", state[f]); }
 load();
});
$("#export").onclick = ()=>{ window.location = "/api/export.csv?"+qs(); };
$("#minscore").onchange = e=>{ state.min_score = e.target.value; load(); };
function setSort(s){ state.sort = state.sort===s ? "" : s;
 $("#sortscore").classList.toggle("on", state.sort==="score");
 $("#sortpay").classList.toggle("on", state.sort==="salary"); load(); }
$("#sortscore").onclick = ()=> setSort("score");
$("#sortpay").onclick = ()=> setSort("salary");
$("#haspay").onchange = e=>{ state.has_pay = e.target.checked; load(); };
$("#country").onchange = e=>{ state.country = e.target.value; load(); };

loadStats(); load();
</script>
</body>
</html>
